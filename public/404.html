<!DOCTYPE html>
<html lang="fr-CH">
<head>

<title>Page introuvable — ImmoFilms.ch</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 30%,rgba(201,164,92,.12),transparent 60%),#07070a;
    color:#f6f3ec;font-family:Manrope,system-ui,sans-serif}
  img{width:min(320px,80vw);margin:0 auto 48px;display:block}
  .code{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(5rem,18vw,9rem);line-height:1;
    background:linear-gradient(100deg,#8a6a2c,#e9d18f 35%,#fff1c6 60%,#a07c35);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(1.6rem,4vw,2.4rem);margin:10px 0 14px}
  p{color:#a9a59b;margin-bottom:36px}
  a.btn{display:inline-block;padding:16px 30px;border-radius:999px;font-size:.8rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:#120e05;text-decoration:none;background:linear-gradient(100deg,#b8913f,#ecd497 50%,#c9a45c);box-shadow:0 10px 40px -10px rgba(201,164,92,.55);transition:transform .4s}
  a.btn:hover{transform:translateY(-3px)}
</style>
</head>
<body>
  <main>
    <img src="/assets/logo-immofilms.svg" alt="ImmoFilms.ch">

    <a class="btn" href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
